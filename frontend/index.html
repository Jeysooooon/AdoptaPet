<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AdoptaPet - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo">

            <h1>🐾 AdoptaPet</h1>

            <p>
                ADOPTAPET
            </p>

        </div>


        <div id="message" class="message"></div>


        <form id="loginForm">

            <div class="form-group">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
                style="width:100%;"
            >
                Iniciar sesión
            </button>

        </form>

    </div>

</div>


<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/common.js"></script>


<script>

const form =
    document.getElementById("loginForm");

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const correo =
            document.getElementById("correo")
                .value.trim();

        const password =
            document.getElementById("password")
                .value;

        try {

            const response =
                await fetch(
                    API.USUARIOS + "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            correo,
                            password
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Credenciales inválidas."
                );

            }

            saveAuth(data);

            window.location.href =
                "dashboard.html";

        } catch (error) {

            showMessage(
                error.message,
                "error"
            );

        }

    }
);

</script>

</body>
</html>
