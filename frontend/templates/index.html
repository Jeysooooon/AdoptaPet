<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AdoptaPet - Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom styles -->
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="app-shell d-flex">
    <!-- Sidebar -->
    <aside class="sidebar bg-dark text-white d-flex flex-column">
      <div class="sidebar-brand px-3 py-4 d-flex align-items-center">
        <i class="bi bi-paw-fill text-emerald me-2 fs-4"></i>
        <span class="fs-5 fw-bold">AdoptaPet</span>
      </div>

      <nav class="flex-fill px-2">
        <ul class="nav flex-column gap-1">
          <li class="nav-item"><a class="nav-link text-white" href="#" data-route="pets"><i class="bi bi-card-image me-2"></i> 🐾 Mascotas</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#" data-route="adoptions"><i class="bi bi-list-check me-2"></i> 📋 Adopciones</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#" data-route="donations"><i class="bi bi-heart-fill me-2"></i> 💚 Donaciones</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#" data-route="events"><i class="bi bi-calendar-event me-2"></i> 📅 Eventos</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#" data-route="notifications"><i class="bi bi-bell-fill me-2"></i> 🔔 Notificaciones</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#" data-route="account"><i class="bi bi-person-circle me-2"></i> 👤 Mi Cuenta</a></li>
        </ul>
      </nav>

      <div class="sidebar-footer px-3 py-3 small text-muted">
        <div>Conectado a API local</div>
      </div>
    </aside>

    <!-- Main content -->
    <div class="main flex-fill d-flex flex-column">
      <!-- Header -->
      <header class="topbar d-flex justify-content-between align-items-center px-4 py-2 shadow-sm">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-sm btn-outline-secondary d-md-none" id="toggleSidebar"><i class="bi bi-list"></i></button>
          <h2 class="h5 m-0 text-muted" id="view-title">Dashboard</h2>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="text-end me-3">
            <div id="user-name" class="fw-semibold">Invitado</div>
            <div id="user-role" class="small text-muted">-</div>
          </div>
          <button id="btn-logout" class="btn btn-outline-danger btn-sm" style="display:none"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
          <button id="btn-login" class="btn btn-success btn-sm"><i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión / Registrarse</button>
        </div>
      </header>

      <!-- Content area -->
      <div class="content p-4" id="main-content">
        <div id="alert-container"></div>
        <!-- Vistas dinámicas renderizadas por app.js -->
        <div id="view-root"></div>
      </div>

    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="authModalTitle">Iniciar sesión</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Pestañas para alternar entre Iniciar sesión y Registrarse -->
          <ul class="nav nav-pills nav-fill mb-3" id="authTabs">
            <li class="nav-item">
              <button type="button" class="nav-link active" id="authTabLogin" data-mode="login">Iniciar sesión</button>
            </li>
            <li class="nav-item">
              <button type="button" class="nav-link" id="authTabRegister" data-mode="register">Registrarse</button>
            </li>
          </ul>
          <form id="authForm">
            <div class="mb-3 d-none" id="authNombreGroup">
              <label class="form-label">Nombre completo</label>
              <input type="text" id="authNombre" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input type="email" id="authEmail" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" id="authPassword" class="form-control" required>
            </div>
            <input type="hidden" id="authMode" value="login">
            <div class="mb-2 text-muted small">
              <a href="#" id="switchToRegister">¿No tienes cuenta? Regístrate</a>
            </div>
            <div class="d-grid">
              <button class="btn btn-primary" type="submit" id="authSubmit">Entrar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS + Popper (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- FullCalendar (pestaña Eventos) — el bundle global inyecta sus propios estilos -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales-all.global.min.js"></script>
  <!-- App JS (dashboard) -->
  <script type="module" src="/static/js/dashboard-full.js"></script>
</body>
</html>
