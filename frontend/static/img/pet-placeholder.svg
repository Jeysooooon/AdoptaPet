<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Sin foto disponible">
  <rect width="400" height="300" fill="#f3f4f6"/>
  <g transform="translate(200,150)" fill="#c9d0da">
    <!-- Cabeza -->
    <circle cx="0" cy="10" r="55"/>
    <!-- Orejas -->
    <ellipse cx="-45" cy="-35" rx="18" ry="26" transform="rotate(-25 -45 -35)"/>
    <ellipse cx="45" cy="-35" rx="18" ry="26" transform="rotate(25 45 -35)"/>
    <!-- Hocico -->
